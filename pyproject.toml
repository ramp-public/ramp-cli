[project]
name = "ramp-cli"
description = "Ramp Developer CLI — interact with Ramp's API from your terminal"
authors = [{ name = "Ramp", email = "developer@ramp.com" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0,<9",
    "httpx>=0.25.0",
    "json5>=0.12,<1",
    "jsonref>=1.1.0",
    "questionary>=2.1.1",
    "tomli-w>=1.0.0",
    "zstandard>=0.23,<1",
]
dynamic = ["version"]

[project.scripts]
ramp = "ramp_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ramp_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ramp_cli"]
artifacts = [
    "src/ramp_cli/specs/*.json",
    "src/ramp_cli/skills/*/SKILL.md",
]
exclude = [
    "/src/ramp_cli/router_integrations/packages/*/dist/*",
    "/src/ramp_cli/router_integrations/packages/*/package.json",
]

[tool.hatch.build.targets.wheel.force-include]
# The TypeScript sources are regular package data. Re-add only the manifests
# excluded above so Hatch never writes the same source path twice.
"src/ramp_cli/router_integrations/packages/opencode-provider/package.json" = "ramp_cli/router_integrations/packages/opencode-provider/package.json"
"src/ramp_cli/router_integrations/packages/pi-provider/package.json" = "ramp_cli/router_integrations/packages/pi-provider/package.json"

[tool.hatch.build.targets.sdist.force-include]
"src/ramp_cli/router_integrations/packages/opencode-provider/src" = "src/ramp_cli/router_integrations/packages/opencode-provider/src"
"src/ramp_cli/router_integrations/packages/opencode-provider/package.json" = "src/ramp_cli/router_integrations/packages/opencode-provider/package.json"
"src/ramp_cli/router_integrations/packages/pi-provider/src" = "src/ramp_cli/router_integrations/packages/pi-provider/src"
"src/ramp_cli/router_integrations/packages/pi-provider/package.json" = "src/ramp_cli/router_integrations/packages/pi-provider/package.json"

[dependency-groups]
dev = [
    "nuitka>=2.0",
    "ordered-set>=4.0",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "PLC0415"]
